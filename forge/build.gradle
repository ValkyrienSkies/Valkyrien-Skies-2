import org.jetbrains.kotlin.gradle.dsl.JvmTarget

buildscript {
    repositories {
        mavenCentral()
    }
}

plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
    id "com.matthewprenger.cursegradle"
    id "com.modrinth.minotaur"
}

apply from: '../gradle-scripts/publish-curseforge.gradle'

architectury {
    platformSetupLoomIde()
    neoForge()
}

sourceSets {
    main {
        java {
            exclude "org/valkyrienskies/mod/forge/mixin/compat/hexcasting/**"
            exclude "org/valkyrienskies/mod/forge/mixin/compat/connectiblechains/**"
            exclude "org/valkyrienskies/mod/forge/mixin/compat/emf/**"
            exclude "org/valkyrienskies/mod/forge/mixin/compat/sodium/**"
            exclude "org/valkyrienskies/mod/forge/mixin/compat/create/client/MixinSuperGlueSelectionHandler66.java"
            exclude "org/valkyrienskies/mod/forge/mixin/feature/forge_interact/MixinIForge2Player.java"
            exclude "org/valkyrienskies/mod/forge/mixin/compat/create/MixinDeployerHandler.java"
            exclude "org/valkyrienskies/mod/forge/mixin/compat/create/MixinLaunchedItem.java"
            exclude "org/valkyrienskies/mod/forge/mixin/compat/create/MixinToolboxHandler.java"
            exclude "org/valkyrienskies/mod/forge/mixin/compat/create/block/MixinITrackBlock.java"
            exclude "org/valkyrienskies/mod/forge/mixin/compat/create/block/MixinTurntableBlock.java"
            exclude "org/valkyrienskies/mod/forge/mixin/compat/create/blockentity/MixinChainConveyorBlockEntity.java"
            exclude "org/valkyrienskies/mod/forge/mixin/compat/create/blockentity/MixinChainConveyorRidingHandler.java"
            exclude "org/valkyrienskies/mod/forge/mixin/compat/create/blockentity/MixinFrogportBlockEntity.java"
            exclude "org/valkyrienskies/mod/forge/mixin/compat/create/blockentity/MixinNozzleBlockEntity.java"
            exclude "org/valkyrienskies/mod/forge/mixin/compat/create/blockentity/MixinSchematicannonBlockEntity.java"
            exclude "org/valkyrienskies/mod/forge/mixin/compat/create/client/MixinCarriageSounds.java"
            exclude "org/valkyrienskies/mod/forge/mixin/compat/create/client/MixinChainConveyorBlockEntity.java"
            exclude "org/valkyrienskies/mod/forge/mixin/compat/create/client/MixinFrogportRenderer.java"
            exclude "org/valkyrienskies/mod/forge/mixin/compat/create/client/MixinFrogportVisual.java"
            exclude "org/valkyrienskies/mod/forge/mixin/compat/create/client/MixinSchematicannonRenderer.java"
            exclude "org/valkyrienskies/mod/forge/mixin/compat/create/client/MixinToolboxHandlerClient.java"
            exclude "org/valkyrienskies/mod/forge/mixin/compat/create/client/MixinTrackTargetingClient.java"
        }
        kotlin {
            exclude "org/valkyrienskies/mod/forge/compat/hexcasting/**"
        }
        resources {
            srcDir "$buildDir/generated/resources"
        }
    }
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "valkyrienskies-refmap.json"
    }

    mods {
        "valkyrienskies" {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    core
    testImplementation.extendsFrom common, core
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
    compileClasspath.extendsFrom core
    forgeRuntimeLibrary.extendsFrom core
    shadowCommon.extendsFrom core
    shadowCommonDevNoShadow
    shadowCommonDevNoShadow.extendsFrom core
}

dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.8.1"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.8.1"
    testImplementation "io.mockk:mockk:1.12.5"
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:${rootProject.mixinextras_version}"))
    annotationProcessor("net.fabricmc:sponge-mixin:0.12.5+mixin.0.8.5") // use fabric mixin so we can write interface injectors (conditionally loaded if mixinbooster is enabled)

    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(path: ":common", configuration: "namedElements")) {
        transitive = false
    }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) {
        transitive = false
    }
    shadowCommonDevNoShadow(project(path: ":common", configuration: "transformProductionNeoForge")) {
        transitive = false
    }

    modCompileOnly("maven.modrinth:embeddium:${embeddium_version}")
    //modRuntimeOnly("maven.modrinth:embeddium:${embeddium_version}")

    // radium and enemies (radium reforged works natively)
    compileOnly('com.github.dima_dencep.mods:NanoLiveConfig:1.2.1') {
        exclude(group: "dev.su5ed.sinytra.fabric-api")
    }

    // Twilight Forest
    // modImplementation("teamtwilight:twilightforest:${twilightforest_version}:universal")

    // Create Mod, see https://wiki.createmod.net/developers/depend-on-create/neoforge-1.21.1
    modImplementation("com.simibubi.create:create-${property("minecraft_version")}:${property("forge_create_version")}:slim") { transitive = false }
    modImplementation("net.createmod.ponder:ponder-neoforge:${property("forge_ponder_version")}")
    modCompileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${property("minecraft_version")}:${property("forge_flywheel_version")}")
    modRuntimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${property("minecraft_version")}:${property("forge_flywheel_version")}")
    modImplementation("com.tterrag.registrate:Registrate:${property("forge_registrate_version")}")

    // Weather2 1.20.1
    // Not on 1.21.1 yet
    // modImplementation("curse.maven:weather-storms-tornadoes-237746:5244118")
    // modImplementation("curse.maven:coroutil-237749:5096038")

    // CC Tweaked
    modCompileOnly("maven.modrinth:cc-tweaked:${cc_tweaked_version}")

    // Etched
    modCompileOnly("maven.modrinth:etched:3.0.4")

    // OpenComputers 2: Reimagined
    modCompileOnly("maven.modrinth:oc2r:${oc2r_version}")

    // EMF compat
    // https://www.curseforge.com/minecraft/mc-mods/entity-model-features/files/all?page=1&pageSize=20&version=1.21.1
    modCompileOnly("curse.maven:entity-model-features-844662:6001147")
    // https://www.curseforge.com/minecraft/mc-mods/entity-texture-features-fabric/files/all?page=1&pageSize=20&version=1.21.1
    modCompileOnly("curse.maven:entity-texture-features-fabric-568563:5982151")

    // Not on 1.21.1 yet
    // modCompileOnly("maven.modrinth:create-utilities:0.2.0+1.20.1")
    modCompileOnly("teamreborn:energy:${energy_version}") {
        transitive = false
    }
    // TIS-3d
    modCompileOnly("maven.modrinth:tis3d:${tis3d_version}")

    // Modular Routers
    // https://www.curseforge.com/minecraft/mc-mods/modular-routers/files/all?page=1&pageSize=20&version=1.21.1
    modCompileOnly("curse.maven:modular-routers-250294:6130459")

    // Modular Force Field System
    modCompileOnly("maven.modrinth:mffs:5.1.18")

    // Epic Fight
    modCompileOnly("maven.modrinth:epic-fight:20.10.3")

    // Dynmap
    modCompileOnly("maven.modrinth:dynmap:${dynmap_version}")

    // Hexcasting-family compat from 1.20.1 is disabled on 1.21.1 until the platform coordinates are restored.

    // Integrated Dynamics
    // https://www.curseforge.com/minecraft/mc-mods/integrated-dynamics/files/all?page=1&pageSize=20&version=1.21.1
    modCompileOnly("curse.maven:integrated-dynamics-236307:6250036")
    modCompileOnly("curse.maven:cyclops-core-232758:6230091")
    modCompileOnly("curse.maven:common-capabilities-247007:5980086")

    // Very Many Players
    //modCompileOnly("maven.modrinth:vmp-forge:0.2.0+beta.7.101+1.20.1")

    // Mekanism
    modCompileOnly ("curse.maven:mekanism-268560:6242484")

    // Kotlin for Forge
    forgeRuntimeLibrary(implementation("thedarkcolour:kotlinforforge-neoforge:${kotlin_for_forge_version}"))

    // Cloth for config
    include(modImplementation("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"))

    // Shade vs-core
    implementation("org.valkyrienskies.core:util:${rootProject.vs_core_version}")
    implementation("org.valkyrienskies.core:internal:${rootProject.vs_core_version}") {
        exclude group: 'org.joml', module: 'joml'
    }
    runtimeOnly("org.valkyrienskies.core:impl:${rootProject.vs_core_version}") {
        exclude group: 'org.joml', module: 'joml'
    }
    forgeRuntimeLibrary shadowCommon("org.valkyrienskies.core:impl:${rootProject.vs_core_version}") {
        exclude group: 'org.joml', module: 'joml'
        transitive = false
    }

    // region Manually include every single dependency of vs-core (total meme)
    forgeRuntimeLibrary include("org.valkyrienskies.core:api:${rootProject.vs_core_version}") {
        exclude group: 'org.joml', module: 'joml'
        transitive = false
    }

    forgeRuntimeLibrary shadowCommon("org.valkyrienskies.core:internal:${rootProject.vs_core_version}") {
        exclude group: 'org.joml', module: 'joml'
        transitive = false
    }

    forgeRuntimeLibrary include("org.valkyrienskies.core:util:${rootProject.vs_core_version}") {
        exclude group: 'org.joml', module: 'joml'
        transitive = false
    }

    forgeRuntimeLibrary shadowCommon("org.valkyrienskies:physics_api_krunch:${rootProject.krunch_version}") {
        exclude group: 'org.joml', module: 'joml'
        transitive = false
    }

    forgeRuntimeLibrary shadowCommon("org.valkyrienskies:physics_api:${rootProject.krunch_api_version}") {
        exclude group: 'org.joml', module: 'joml'
        transitive = false
    }

    forgeRuntimeLibrary include("javax.inject:javax.inject:1") { transitive = false }

    // JOML for Math
    forgeRuntimeLibrary include("org.joml:joml-primitives:1.10.0")

    // Apache Commons Math for Linear Programming
    forgeRuntimeLibrary include("org.apache.commons:commons-math3:3.6.1") { transitive = false }

    // Jackson Binary Dataformat for Object Serialization
    def jacksonVersion = '2.14.0'
    // forked to remove module-info
    forgeRuntimeLibrary include("com.fasterxml.jackson.module:jackson-module-kotlin:$jacksonVersion-rubyfork") { transitive = false }
    forgeRuntimeLibrary include("com.fasterxml.jackson.module:jackson-module-parameter-names:$jacksonVersion") { transitive = false }
    forgeRuntimeLibrary include("com.fasterxml.jackson.dataformat:jackson-dataformat-cbor:$jacksonVersion") { transitive = false }
    forgeRuntimeLibrary include("com.fasterxml.jackson.core:jackson-databind:$jacksonVersion") { transitive = false }
    forgeRuntimeLibrary include("com.fasterxml.jackson.core:jackson-annotations:$jacksonVersion") { transitive = false }
    forgeRuntimeLibrary include("com.fasterxml.jackson.core:jackson-core:$jacksonVersion") { transitive = false }
    forgeRuntimeLibrary include("com.github.Rubydesic:jackson-kotlin-dsl:1.2.0") { transitive = false }

    forgeRuntimeLibrary include("com.networknt:json-schema-validator:1.0.71") { transitive = false }
    forgeRuntimeLibrary include("com.ethlo.time:itu:1.7.0") { transitive = false }
    forgeRuntimeLibrary include("com.github.victools:jsonschema-module-jackson:4.25.0") { transitive = false }
    forgeRuntimeLibrary include("com.github.victools:jsonschema-generator:4.25.0") { transitive = false }
    forgeRuntimeLibrary include("com.fasterxml:classmate:1.5.1") { transitive = false }
    forgeRuntimeLibrary include("com.flipkart.zjsonpatch:zjsonpatch:0.4.11") { transitive = false }
    forgeRuntimeLibrary include("org.apache.commons:commons-collections4:4.3") { transitive = false }

    forgeRuntimeLibrary include("com.google.dagger:dagger:2.43.2") { transitive = false }

    // endregion
}

// I don't know why, but this is the only way gradle can launch it
tasks.runClient.configure {
    jvmArgs '-Dkotlinx.coroutines.debug=off'
}

tasks.runServer.configure {
    jvmArgs '-Dkotlinx.coroutines.debug=off'
}

// Copy the VS common access widener to the generated resources folder.
tasks.named('test') { useJUnitPlatform() }

// Copy the VS common access widener to the generated resources folder
def generatedResourcesDir = layout.buildDirectory.dir("generated/resources")

tasks.register("copyAccessWidener", Copy) {
    from(project(":common").file("src/main/resources/valkyrienskies-common.accesswidener"))
    into(generatedResourcesDir)
}

processResources {
    dependsOn("copyAccessWidener")
    inputs.property "version", project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand "version": project.version
    }
}

tasks.register('devNoShadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    // Copy main forge code to this jar
    from(sourceSets.main.output)

    // Copy META-INF/accesstransformer.cfg from remapJar
    dependsOn tasks.named("remapJar")
    doFirst {
        def remapJarFile = tasks.named("remapJar").get().archiveFile.get().asFile

        from({
            zipTree(remapJarFile).matching {
                include "META-INF/accesstransformer.cfg"
            }
        })
    }

    // We still have to shade in the common jar, but nothing else
    configurations = [project.configurations.shadowCommonDevNoShadow]
    archiveClassifier.set("dev-no-shadow")
}

build.dependsOn devNoShadowJar

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"
    // Exclude dummy Optifine classes
    exclude "net/optifine/**"
    exclude "org/apache/commons/**"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set "dev-shadow"
}

remapJar {
    atAccessWideners.add "valkyrienskies-common.accesswidener"
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set null
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
compileKotlin.compilerOptions.jvmTarget = JvmTarget.JVM_21

jar {
    archiveClassifier.set "dev"
}

sourcesJar {
    dependsOn("copyAccessWidener")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            groupId = "org.valkyrienskies"
            version = project.version
            artifactId = rootProject.archives_base_name + "-" + project.name
            // Publish the dev shadow jar to maven
            artifact(shadowJar) {
                classifier "dev-shadow"
            }
            artifact(devNoShadowJar) {
                classifier "dev-no-shadow"
            }
            from components.java
        }
    }
}


