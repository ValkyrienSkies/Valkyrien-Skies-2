# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/2.0/configuration-reference
version: 2.1

parameters:
  publish_dependency_chain:
    type: boolean
    default: false
  chain_native_ref:
    type: string
    default: main
  chain_api_ref:
    type: string
    default: main

orbs:
  discord: antonioned/discord@0.1.0

executors:
  java_large:
    resource_class: large
    docker:
      - image: cimg/openjdk:21.0
    environment:
      ORG_GRADLE_PROJECT_block_external_repositories: "true"

commands:
  checkout_and_cache:
    steps:
      - checkout
      - run: git submodule sync
      - run: git submodule update --init

      - restore_cache:
          keys:
            - v1-gradle-home-{{ checksum "build.gradle" }}-{{ checksum "gradle.properties" }}
            - v1-gradle-home
      - restore_cache:
          keys:
            - v1-{{ checksum "build.gradle" }}-{{ checksum "gradle.properties" }}

  save_artifacts:
    parameters:
      artifact_name:
        type: string
        default: valkyrienskies
      version:
        type: string
        default: ${CIRCLE_SHA1}
    steps:
      - run: mkdir -p artifacts
      - run: |
          set -euo pipefail
          find ./forge/build/libs \
            -name "<< parameters.artifact_name >>*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-dev.jar" \
            ! -name "*-shadow.jar" \
            ! -name "*-javadoc.jar" \
            -exec bash -c 'cp "$0" "./artifacts/<< parameters.artifact_name >>-neoforge-<< parameters.version >>.jar"' {} \;
          find ./fabric/build/libs \
            -name "<< parameters.artifact_name >>*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-dev.jar" \
            ! -name "*-shadow.jar" \
            ! -name "*-javadoc.jar" \
            -exec bash -c 'cp "$0" "./artifacts/<< parameters.artifact_name >>-fabric-<< parameters.version >>.jar"' {} \;
      - store_artifacts:
          path: artifacts
      # Make artifacts available to downstream jobs
      - persist_to_workspace:
          root: .
          paths:
              - artifacts

  save_artifacts_and_generate_discord:
    parameters:
      artifact_name:
        type: string
        default: valkyrienskies
      version:
        type: string
        default: ${CIRCLE_SHA1}
    steps:
      - save_artifacts:
          artifact_name: << parameters.artifact_name >>
          version: << parameters.version >>
      - run: >-
          echo 'export DISCORD_MSG="
          New version, **${CIRCLE_TAG}** |
          [Download NeoForge](https://output.circle-artifacts.com/output/job/${CIRCLE_WORKFLOW_JOB_ID}/artifacts/${CIRCLE_NODE_INDEX}/artifacts/<< parameters.artifact_name >>-neoforge-<< parameters.version >>.jar) |
          [Download Fabric](https://output.circle-artifacts.com/output/job/${CIRCLE_WORKFLOW_JOB_ID}/artifacts/${CIRCLE_NODE_INDEX}/artifacts/<< parameters.artifact_name >>-fabric-<< parameters.version >>.jar)
          "' >> "$BASH_ENV"

  save_gradle_cache:
    steps:
      - save_cache:
          key: v1-gradle-home-{{ checksum "build.gradle" }}-{{ checksum "gradle.properties" }}
          paths:
            - ~/.gradle
      - save_cache:
          key: v1-gradle-{{ checksum "build.gradle" }}-{{ checksum "gradle.properties" }}
          paths:
            - .gradle

  prepare_server_dir:
    parameters:
      server_root:
        type: string
    steps:
      - run:
          name: Prepare clean server directory
          command: |
            set -euo pipefail
            rm -rf "<< parameters.server_root >>"
            mkdir -p "<< parameters.server_root >>/mods"
            mkdir -p "<< parameters.server_root >>/config"

  run_test_server:
    parameters:
      cmd:
        type: string
      workdir:
        type: string
    steps:
      - run:
          name: Run dedicated production server
          command: |
            set -euo pipefail
            cd "<< parameters.workdir >>"

            # Accept eula automatically
            echo "eula=true" > eula.txt || true

            # Pipe "stop" into servers stdin so it closes right after a successful launch
            # Timeout 5 mins just in case, but we should either stop after launch, or error and move on
            timeout 5m echo "stop" | << parameters.cmd >> || true

            # Most reliable way I could find to detect a crash or not
            if grep -q "For help, type \"help\"" logs/latest.log; then
              echo "Server loaded successfully!"
              exit 0
            else
              echo "Server failed to start!"
              exit 1
            fi
      - store_artifacts:
          path: << parameters.workdir >>/logs
          when: always
      - store_artifacts:
          path: << parameters.workdir >>/latest.log
          when: always

jobs:
  resolve_dependency_chain:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    environment:
      CHAIN_NATIVE_REF: << pipeline.parameters.chain_native_ref >>
      CHAIN_API_REF: << pipeline.parameters.chain_api_ref >>
    steps:
      - checkout
      - run:
          name: Resolve immutable publishing inputs
          command: |
            python3 -m unittest discover -s ci/tests
            python3 ci/publish_chain.py resolve --manifest chain/manifest.json \
              --native-ref "$CHAIN_NATIVE_REF" --api-ref "$CHAIN_API_REF"
      - persist_to_workspace:
          root: chain
          paths:
            - manifest.json
      - store_artifacts:
          path: chain/manifest.json

  publish_dependency_chain:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - attach_workspace:
          at: chain
      - run:
          name: Publish pinned dependencies through VS2
          command: python3 ci/publish_chain.py publish --manifest chain/manifest.json --output chain/result.json
          no_output_timeout: 5m
      - store_artifacts:
          path: chain
          when: always

  dependency_chain_superseded:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - run:
          name: Report skipped publishing chain
          command: |
            echo "A newer dependency chain superseded this run. Start a new pipeline from the current branch head."
            exit 1

  gradle_build:
    executor: java_large
    steps:
      - checkout_and_cache
      - run:
          name: Test publishing orchestration
          command: python3 -m unittest discover -s ci/tests
      - run:
          name: Build
          command: "./gradlew build --no-daemon --stacktrace --max-workers 1"
      - store_test_results:
          path: common/build/test-results
      - store_artifacts:
          path: common/build/reports/tests/test
          destination: common-test-report
          when: always
      - save_artifacts
      - persist_to_workspace:
          root: .
          paths:
            - build
            - "*/build"          # forge/build, fabric/build, common/build, ...
            - .gradle            # Gradle's incremental task state
      - save_gradle_cache

  fabric_server_test:
    executor: java_large
    environment:
      MC_VERSION: "1.21.1"
      FABRIC_VERSION: "1.0.1"
    steps:
      - attach_workspace:
          at: .
      - prepare_server_dir:
          server_root: /tmp/fabric-server
      - run:
          name: Find built Fabric mod jar
          command: |
            set -euo pipefail
            FABRIC_JAR="$(pwd)/$(ls -1 artifacts/*-fabric-*.jar | head -n1)"
            if [ -z "${FABRIC_JAR}" ]; then
              echo "No Fabric jar found in artifacts/"
              ls -la artifacts || true
              exit 1
            fi
            echo "export FABRIC_MOD_JAR=${FABRIC_JAR}" >> "$BASH_ENV"
      - run:
          name: Download Fabric server
          command: |
            set -euo pipefail
            cd /tmp/fabric-server
            curl -L "https://maven.fabricmc.net/net/fabricmc/fabric-installer/${FABRIC_VERSION}/fabric-installer-${FABRIC_VERSION}.jar" -o fabric-installer-${FABRIC_VERSION}.jar
      - run:
          name: Install Fabric server
          command: |
            set -euo pipefail
            cd /tmp/fabric-server
            # Generates server.jar and required loader files for the requested MC version.
            java -jar fabric-installer-${FABRIC_VERSION}.jar server -downloadMinecraft -mcversion "${MC_VERSION}" -noprofile
            # Copy mod jar into mods/
            cp "${FABRIC_MOD_JAR}" mods/
      - run:
          name: Download Fabric API (latest compatible with ${MC_VERSION})
          command: |
            set -euo pipefail
            cd /tmp/fabric-server
            # Ask Modrinth for the newest Fabric API release that targets this MC version
            # instead of hard-coding a URL that has to be hand-updated each MC bump.
            FABRIC_API_URL=$(curl -fsSL \
              "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%22${MC_VERSION}%22%5D&loaders=%5B%22fabric%22%5D" \
              | grep -oE '"url":"[^"]+\.jar"' | head -n1 | sed 's/"url":"//; s/"$//')
            if [ -z "${FABRIC_API_URL}" ]; then
              echo "Could not resolve a Fabric API version for MC ${MC_VERSION}"
              exit 1
            fi
            curl -L "${FABRIC_API_URL}" -o mods/fabric-api.jar
      - run_test_server:
          cmd: "java -Xmx2G -Xms2G -jar fabric-server-launch.jar nogui"
          workdir: "/tmp/fabric-server"

  forge_server_test:
    executor: java_large
    environment:
      MC_VERSION: "1.21.1"
      NEOFORGE_VERSION: "21.1.206"
    steps:
      - attach_workspace:
          at: .
      - prepare_server_dir:
          server_root: /tmp/forge-server
      - run:
          name: Find built NeoForge mod jar
          command: |
            set -euo pipefail
            # save_artifacts names the produced jar <name>-neoforge-<sha>.jar since the
            # forge/ subproject builds for NeoForge 21.1.
            FORGE_JAR="$(pwd)/$(ls -1 artifacts/*-neoforge-*.jar | head -n1)"
            if [ -z "${FORGE_JAR}" ]; then
              echo "No NeoForge jar found in artifacts/"
              ls -la artifacts || true
              exit 1
            fi
            echo "export FORGE_MOD_JAR=${FORGE_JAR}" >> "$BASH_ENV"
      - run:
          name: Download NeoForge server installer
          command: |
            set -euo pipefail
            cd /tmp/forge-server
            curl -L "https://maven.neoforged.net/releases/net/neoforged/neoforge/${NEOFORGE_VERSION}/neoforge-${NEOFORGE_VERSION}-installer.jar" -o neoforge-installer.jar
      - run:
          name: Install NeoForge server
          command: |
            set -euo pipefail
            cd /tmp/forge-server
            java -jar neoforge-installer.jar --installServer
            # Copy the mod into mods/
            cp "${FORGE_MOD_JAR}" mods/
      - run:
          name: Download Kotlin For Forge (NeoForge, latest compatible with ${MC_VERSION})
          command: |
            set -euo pipefail
            cd /tmp/forge-server
            # Modrinth project 'ordsPcFz' is Kotlin For Forge. Fetch the newest neoforge
            # jar for this MC version instead of pinning a URL.
            KFF_URL=$(curl -fsSL \
              "https://api.modrinth.com/v2/project/ordsPcFz/version?game_versions=%5B%22${MC_VERSION}%22%5D&loaders=%5B%22neoforge%22%5D" \
              | grep -oE '"url":"[^"]+\.jar"' | head -n1 | sed 's/"url":"//; s/"$//')
            if [ -z "${KFF_URL}" ]; then
              echo "Could not resolve a Kotlin For Forge (NeoForge) version for MC ${MC_VERSION}"
              exit 1
            fi
            curl -L "${KFF_URL}" -o mods/kff.jar
      - run_test_server:
          cmd: "./run.sh nogui"
          workdir: "/tmp/forge-server"

  publish_to_maven:
    executor: java_large
    steps:
      - checkout_and_cache
      - attach_workspace:
          at: .
      - run:
          name: Publish
          command: "./gradlew publish --no-daemon --stacktrace"

  deploy_to_curse:
    executor: java_large
    steps:
      - checkout_and_cache
      - run: echo 'export ORG_GRADLE_PROJECT_CustomReleaseVersion=${CIRCLE_TAG}' >> "$BASH_ENV"
      - run:
          command: "./gradlew build modrinth curseforge publish --no-daemon --stacktrace --max-workers 1 --continue"

  notify_playtesters:
    executor: java_large
    steps:
      - checkout_and_cache
      - run:
          name: Build
          command: "./gradlew build --no-daemon --stacktrace --max-workers 1"
      - store_test_results:
          path: common/build/test-results
      - store_artifacts:
          path: common/build/reports/tests/test
          destination: common-test-report
          when: always
      - save_artifacts_and_generate_discord
      - discord/status:
          success_message: ${DISCORD_MSG}
          success_only: true
          webhook: ${VS2_120_WEBHOOK}

  deploy_to_lilypad:
    executor: java_large
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Find built Forge mod jar
          command: |
            set -euo pipefail
            FORGE_JAR="$(pwd)/$(ls -1 artifacts/*-forge-*.jar | head -n1)"
            if [ -z "${FORGE_JAR}" ]; then
              echo "No Forge jar found in artifacts/"
              ls -la artifacts || true
              exit 1
            fi

            PLAYTEST_JAR="$(pwd)/vs-playtest.jar"
            cp "${FORGE_JAR}" "${PLAYTEST_JAR}"

            echo "Prepared playtest jar: ${PLAYTEST_JAR}"
            echo "export FORGE_MOD_JAR='${PLAYTEST_JAR}'" >> "$BASH_ENV"
      - run:
          name: Install SSH tools
          command: sudo apt-get update && sudo apt-get install -y openssh-client
      - run:
          name: Upload jar to Lilypad mods folder
          command: |
            mkdir -p ~/.ssh
            echo "${LILYPAD_SFTP_PRIVATE_KEY}" | base64 -d > ~/.ssh/lilypad_key
            chmod 600 ~/.ssh/lilypad_key

            sftp \
              -i ~/.ssh/lilypad_key \
              -o StrictHostKeyChecking=no \
              -P "${LILYPAD_SFTP_PORT}" \
              "${LILYPAD_SFTP_USER}@${LILYPAD_SFTP_HOST}" \<<EOF
            cd mods
            put "${FORGE_MOD_JAR}"
            bye
            EOF
      - run:
          name: Restart Lilypad server
          command: |
            curl --fail-with-body -X POST "https://panel.lilypad.gg/api/client/servers/${LILYPAD_SERVER_ID}/power" \
              -H "Authorization: Bearer ${LILYPAD_API_KEY}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -d '{"signal":"restart"}'

workflows:
  dependency_chain:
    when: << pipeline.parameters.publish_dependency_chain >>
    jobs:
      - resolve_dependency_chain:
          context: dependency-publishing
          filters:
            branches:
              only: 1.20.1/playtest
      - publish_dependency_chain:
          requires:
            - resolve_dependency_chain
          serial-group: << pipeline.project.slug >>/dependency-publishing
          context: dependency-publishing
          filters:
            branches:
              only: 1.20.1/playtest
      - dependency_chain_superseded:
          requires:
            - publish_dependency_chain: not_run
          filters:
            branches:
              only: 1.20.1/playtest
  build:
    when:
      not: << pipeline.parameters.publish_dependency_chain >>
    jobs:
      - gradle_build:
          context:
            - valkyrien_maven

      - fabric_server_test:
          requires:
            - gradle_build
          context:
            - valkyrien_maven

      - forge_server_test:
          requires:
            - gradle_build
          context:
            - valkyrien_maven

      - notify_playtesters:
          filters:
            tags:
              only: /^playtest.*/
            branches:
              ignore: /.*/
          context:
            - discord_webhooks
            - valkyrien_maven

      - deploy_to_curse:
          filters:
            tags:
              only: /^release.*/
            branches:
              ignore: /.*/
          context:
            - curse_publishing
            - valkyrien_maven

      - publish_to_maven:
          requires:
            - gradle_build
          filters:
            branches:
              only:
                - /.*\/main/
                - /.*\/playtest/
          context:
            - valkyrien_maven
            - github_maven

      - deploy_to_lilypad:
          requires:
            - notify_playtesters
          filters:
            tags:
              only: /^playtest\/1\.20\.1\/.*/
            branches:
              ignore: /.*/
          context:
            - valkyrien_maven
            - lilypad_publishing
